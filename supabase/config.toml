project_id = "workout-maker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://ai-coach-app-mu.vercel.app"
additional_redirect_urls = [
	"https://ai-coach-app-mu.vercel.app/auth/callback",
	"https://ai-coach-app-mu.vercel.app/reset-password"
	]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Mirrors production (the real switch lives in the Supabase dashboard — this
# file only affects local dev). Local confirmation mails land in Inbucket:
# http://localhost:54324
enable_confirmations = true

[realtime]
enabled = true

# Edge Functions. JWT verification is on by default; sync-intervals is also
# invoked by pg_cron with the service_role key, which satisfies verification.
[functions.sync-intervals]
verify_jwt = true
[functions.generate-workout]
verify_jwt = true
[functions.push-workout]
verify_jwt = true
[functions.test-llm-key]
verify_jwt = true
[functions.daily-summary]
verify_jwt = true
[functions.weather-check]
verify_jwt = true
[functions.connect-intervals]
verify_jwt = true
[functions.coach-chat]
verify_jwt = true
[functions.schedule-template]
verify_jwt = true
[functions.intervals-stats]
verify_jwt = true
[functions.refresh-memory]
verify_jwt = true
[functions.push-strength]
verify_jwt = true
[functions.plan-week]
verify_jwt = true
[functions.delete-workout]
verify_jwt = true
[functions.injury-checkin]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
[functions.verify-purchase]
verify_jwt = true
# Pub/Sub push can't send a Supabase JWT; auth is the ?secret= in the endpoint URL.
[functions.play-rtdn]
verify_jwt = false

[functions.sync-calendar]
verify_jwt = true
