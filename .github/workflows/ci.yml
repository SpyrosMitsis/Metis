name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all functions
        run: deno check */index.ts _shared/*.ts
      - name: Unit tests
        # --allow-all matches scripts/dev.sh deno:test — several suites read
        # Deno.env (entitlement/llm/quota) and source files (dash-free contract).
        run: deno test --allow-all _shared/

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        # SUPABASE_URL/ANON_KEY default to "" when unset — fine for unit tests.
        # Flavor-qualified tasks: plain testDebugUnitTest stopped existing when
        # the play/foss flavors were introduced. Running both also compiles
        # both flavors' sources in CI.
        run: ./gradlew testPlayDebugUnitTest testFossDebugUnitTest --no-daemon

      - name: Lint
        # Android Lint ships with AGP but was never actually invoked, so its
        # findings had no way to reach anyone.
        run: ./gradlew lintPlayDebug --no-daemon

      - name: Release build (R8)
        # Debug builds never exercise minification. isMinifyEnabled is on for
        # release, so a -keep rule that stops matching after code moves would
        # otherwise only surface in a Play upload. Signing falls back to the
        # debug key when RELEASE_STORE_FILE is unset, so this needs no secrets.
        run: ./gradlew assemblePlayRelease --no-daemon

      - name: Room schema is committed
        # exportSchema=true writes app/schemas/*.json. If an entity changed
        # without the baseline being regenerated and committed, that is a
        # migration crash waiting to happen on a user's device — fail here
        # instead.
        run: git diff --exit-code -- app/schemas

  engine-quality:
    name: Engine scenarios and transaction contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Isolated PostgreSQL scenarios
        run: python3 scripts/engine-tests/run.py | tee "$RUNNER_TEMP/engine-database.log"
      - name: Existing-row Room migration contract
        run: python3 scripts/engine-tests/room_migration.py
      - name: Production prescription matrix and multiweek review packet
        run: deno run --allow-read --allow-write --allow-env scripts/engine-eval/run.ts "$RUNNER_TEMP/engine-evaluation" --transaction-evidence "$RUNNER_TEMP/engine-database.log"
      - name: Preserve review evidence
        uses: actions/upload-artifact@v4
        with:
          name: engine-quality-evidence
          path: |
            ${{ runner.temp }}/engine-evaluation
            ${{ runner.temp }}/engine-database.log
